<svg width="500" height="200" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Andrew Letov — by the numbers">
  <style>
    .title { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .label { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .value { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2f81f7; }
    .foot  { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7d8590; }
  </style>
  <rect x="0.5" y="0.5" width="499" height="199" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="42" class="title">Andrew Letov — by the numbers</text>

  <!-- left column -->
  <circle cx="32" cy="82" r="4" fill="#3fb950"/>
  <text x="46" y="87" class="label">Downloads (all releases)</text>
  <text x="250" y="87" class="value" text-anchor="end">200K+</text>

  <circle cx="32" cy="116" r="4" fill="#e3b341"/>
  <text x="46" y="121" class="label">Total Stars</text>
  <text x="250" y="121" class="value" text-anchor="end">1,384</text>

  <circle cx="32" cy="150" r="4" fill="#8b949e"/>
  <text x="46" y="155" class="label">Public Repos</text>
  <text x="250" y="155" class="value" text-anchor="end">120</text>

  <line x1="270" y1="70" x2="270" y2="162" stroke="#30363d"/>

  <!-- right column -->
  <circle cx="292" cy="82" r="4" fill="#a371f7"/>
  <text x="306" y="87" class="label">Native macOS Apps</text>
  <text x="476" y="87" class="value" text-anchor="end">3</text>

  <circle cx="292" cy="116" r="4" fill="#db61a2"/>
  <text x="306" y="121" class="label">Followers</text>
  <text x="476" y="121" class="value" text-anchor="end">19</text>

  <circle cx="292" cy="150" r="4" fill="#f85149"/>
  <text x="306" y="155" class="label">Contributions (1yr)</text>
  <text x="476" y="155" class="value" text-anchor="end">1,863</text>

  <text x="28" y="187" class="foot">Updated September 2026 · downloads across all Nextpad++ releases (incl. removed)</text>
</svg>
